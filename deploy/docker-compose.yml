# Betrieb auf einem Server im Internet (z. B. OVH VPS).
# Caddy steht vor der App und holt automatisch ein HTTPS-Zertifikat.
# Die App selbst verlangt eine Anmeldung (Passwort oder Passkey), damit niemand
# Fremdes Standort und Akkustand sieht.
# Gestartet wird alles von deploy/setup.sh bzw. deploy/update.sh.
# Automatische Updates: GitHub Actions baut das Image, deploy/deploy.sh holt es.
services:
  app:
    # Fertiges Image aus GitHub Actions. "build" bleibt für setup.sh/update.sh,
    # die das Image notfalls direkt auf dem Server bauen.
    image: ghcr.io/noahtrr/ford-ev-api:latest
    build: ..
    # caddy.env liefert LOGIN_USER und LOGIN_HASH für den Login und DOMAIN für Passkeys.
    env_file:
      - ../.env
      - caddy.env
    volumes:
      - ford-data:/data
    restart: unless-stopped
    # Kein "ports": die App ist nur für Caddy erreichbar, nicht direkt aus dem Internet.

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    env_file: caddy.env
    labels:
      # Nach jeder Änderung am Caddyfile hochzählen: dann startet der nächste Deploy
      # Caddy neu und es liest das Caddyfile neu ein (sonst läuft die alte Version weiter).
      # 2: Login nicht mehr in Caddy, sondern in der App.
      ford.caddyfile-version: "2"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ford-data:
  caddy-data:
